name: app-rebase
# Plan 0, tarea 3, paso 4: ¿el token de la App sin permiso `workflows` puede hacer
# rebase de una rama factory/* cuando main trae cambios en .github/workflows?
on: workflow_dispatch
jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: factory/t-1
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Rebase sobre main y force-push
        run: |
          git -c user.name=factory -c user.email=factory@example.invalid rebase origin/main
          git diff --stat HEAD@{1} HEAD -- .github/workflows || true
          if git push --force-with-lease origin HEAD:factory/t-1 2>&1; then echo "RESULTADO: rebase aceptado"; else echo "RESULTADO: rebase rechazado"; fi
      - name: Control, rama nueva desde main con el diff aplicado
        run: |
          git checkout -q -B factory/t-1-b origin/main
          git checkout factory/t-1 -- agent.txt 2>/dev/null || echo "cambio del agente" > agent.txt
          git add agent.txt && git -c user.name=factory -c user.email=factory@example.invalid commit -qm "factory: t-1 sobre main"
          if git push -f origin HEAD:factory/t-1-b 2>&1; then echo "RESULTADO: rama nueva aceptada"; else echo "RESULTADO: rama nueva rechazada"; fi
      - name: La App intenta cambiar un workflow (debe fallar)
        run: |
          git checkout -q -B factory/t-1-c origin/main
          echo "# cambio del agente" >> .github/workflows/agent-perms.yml
          git add . && git -c user.name=factory -c user.email=factory@example.invalid commit -qm "factory: toca un workflow"
          if git push -f origin HEAD:factory/t-1-c 2>&1; then echo "RESULTADO: cambio de workflow aceptado (MAL)"; else echo "RESULTADO: cambio de workflow rechazado (BIEN)"; fi
